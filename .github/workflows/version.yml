name: Versioning

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Type d'incrément de version
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Incrémenter la version et créer le tag
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ inputs.bump }}
          force_bump: ${{ inputs.bump }}
          tag_prefix: v
          release_branches: main

      - name: Afficher le nouveau tag
        run: echo "Nouveau tag ${{ steps.tag.outputs.new_tag }}"
