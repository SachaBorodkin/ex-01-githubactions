name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter le lint
        run: npm run lint

      - name: Préparer l'artefact du projet
        run: |
          mkdir -p artifact
          tar --exclude=node_modules --exclude=.git --exclude=artifact -czf artifact/project.tar.gz .

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: project
          path: artifact/project.tar.gz
          if-no-files-found: error
